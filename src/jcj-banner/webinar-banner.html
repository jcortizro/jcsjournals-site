<!-- jcj-webinar-banner:start (part file src/jcj-banner/webinar-banner.html; on/off switch BANNER_ON in tools/jcj-banner.py) -->
<style>
#jcj-webinar{display:block;box-sizing:border-box;width:100%;margin:0;padding:12px 16px;background:#E4BE3F;border-bottom:2px solid #0e140e;text-align:center}
#jcj-webinar *{box-sizing:border-box}
#jcj-webinar .jw-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px}
#jcj-webinar a.jw-img{display:block;width:100%;max-width:600px;line-height:0}
#jcj-webinar a.jw-img img{display:block;width:100%;height:auto;border:0;border-radius:8px}
#jcj-webinar p.jw-line{margin:0;padding:0;color:#0e140e;background:transparent;font:700 17px/1.35 'Source Sans 3','Segoe UI',system-ui,sans-serif;letter-spacing:.01em;overflow-wrap:anywhere}
#jcj-webinar a.jw-btn{display:inline-block;margin:0;padding:10px 22px;background:#0e140e;color:#F4F2EA;font:800 15px/1.2 'Montserrat','Segoe UI',Arial,sans-serif;text-decoration:none;border:0;border-radius:999px;white-space:nowrap}
#jcj-webinar a.jw-btn:hover,#jcj-webinar a.jw-btn:focus-visible{background:#1d2a1d;color:#FFFFFF;outline:2px solid #0e140e;outline-offset:2px}
</style>
<div id="jcj-webinar" role="region" aria-label="Free live class">
  <div class="jw-in">
    {{IMAGE}}
    <p class="jw-line">FREE LIVE CLASS · Thu Nov 19 · 4 PM PT / 7 PM ET · Are You Fatigued or Bloated?</p>
    <a class="jw-btn" href="https://go.mucusfreelife.com/webinar-jc-site" target="_blank" rel="noopener">Register free</a>
  </div>
</div>
<!-- jcj-webinar-banner:end -->
